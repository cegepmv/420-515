<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Segoe UI, Arial, sans-serif">
  <text x="350" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Dépôt local vs dépôt distant</text>

  <!-- Remote repo -->
  <rect x="270" y="50" width="160" height="70" rx="10" fill="#fdf3e3" stroke="#d69a1f" stroke-width="2"/>
  <text x="350" y="80" font-weight="bold" font-size="14" text-anchor="middle" fill="#8a5a00">Dépôt distant</text>
  <text x="350" y="100" font-size="12" text-anchor="middle" fill="#333">(remote / origin)</text>

  <!-- Local repos -->
  <rect x="40" y="170" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="2"/>
  <text x="115" y="200" font-weight="bold" font-size="13" text-anchor="middle" fill="#1a3a75">Poste local A</text>
  <text x="115" y="218" font-size="11" text-anchor="middle" fill="#333">(dépôt + staging)</text>

  <rect x="275" y="170" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="2"/>
  <text x="350" y="200" font-weight="bold" font-size="13" text-anchor="middle" fill="#1a3a75">Poste local B</text>
  <text x="350" y="218" font-size="11" text-anchor="middle" fill="#333">(dépôt + staging)</text>

  <rect x="510" y="170" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="2"/>
  <text x="585" y="200" font-weight="bold" font-size="13" text-anchor="middle" fill="#1a3a75">Poste local C</text>
  <text x="585" y="218" font-size="11" text-anchor="middle" fill="#333">(dépôt + staging)</text>

  <!-- Arrows -->
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M170 190 C 220 160, 240 140, 275 120" marker-end="url(#a2)"/>
    <path d="M275 100 C 240 130, 220 150, 170 175" marker-end="url(#a2)"/>
    <path d="M400 120 C 400 140, 400 155, 400 168" marker-end="url(#a2)"/>
    <path d="M420 168 C 420 155, 420 140, 420 120" marker-end="url(#a2)"/>
    <path d="M530 190 C 480 160, 460 140, 425 120" marker-end="url(#a2)"/>
    <path d="M425 100 C 460 130, 480 150, 530 175" marker-end="url(#a2)"/>
  </g>
  <text x="230" y="145" font-size="11" fill="#555">push/pull</text>
  <text x="470" y="145" font-size="11" fill="#555">push/pull</text>

  <text x="350" y="255" font-size="12" text-anchor="middle" fill="#555">
    Chaque personne travaille sur une copie locale complète et synchronise via push/pull.
  </text>
</svg>
