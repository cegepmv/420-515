<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Segoe UI, Arial, sans-serif">
  <text x="350" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Waterfall vs Agile</text>

  <!-- Waterfall -->
  <text x="170" y="55" font-size="14" font-weight="bold" text-anchor="middle" fill="#444">Waterfall (cascade)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="20" y="65" width="90" height="30" fill="#e8f0fe" stroke="#3b6fd6"/>
    <text x="65" y="84">Analyse</text>
    <rect x="90" y="100" width="90" height="30" fill="#e6f5ea" stroke="#2e9e4f"/>
    <text x="135" y="119">Conception</text>
    <rect x="160" y="135" width="90" height="30" fill="#fdf3e3" stroke="#d69a1f"/>
    <text x="205" y="154">Implémentation</text>
    <rect x="230" y="170" width="90" height="30" fill="#fdeaf1" stroke="#c8447a"/>
    <text x="275" y="189">Tests</text>
    <rect x="300" y="205" width="90" height="30" fill="#eee6fb" stroke="#7a4fd6"/>
    <text x="345" y="224">Déploiement</text>
  </g>
  <path d="M65 95 L65 100 M135 130 L135 135 M205 165 L205 170 M275 200 L275 205" stroke="#888" stroke-width="1.5" fill="none"/>

  <!-- Agile -->
  <text x="530" y="55" font-size="14" font-weight="bold" text-anchor="middle" fill="#444">Agile (itératif)</text>
  <g>
    <circle cx="430" cy="110" r="30" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="2"/>
    <text x="430" y="114" font-size="11" text-anchor="middle">Sprint 1</text>
    <circle cx="530" cy="110" r="30" fill="#e6f5ea" stroke="#2e9e4f" stroke-width="2"/>
    <text x="530" y="114" font-size="11" text-anchor="middle">Sprint 2</text>
    <circle cx="630" cy="110" r="30" fill="#fdf3e3" stroke="#d69a1f" stroke-width="2"/>
    <text x="630" y="114" font-size="11" text-anchor="middle">Sprint 3</text>
  </g>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="460" y1="110" x2="498" y2="110" stroke="#555" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="560" y1="110" x2="598" y2="110" stroke="#555" stroke-width="2" marker-end="url(#a5)"/>
  <text x="530" y="160" font-size="11" text-anchor="middle" fill="#555">chaque sprint livre une portion fonctionnelle et testée</text>
  <path d="M 430 145 Q 430 175 480 175" stroke="#c8447a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#a5)"/>
  <text x="450" y="195" font-size="10" fill="#8a1f4d">rétroaction continue</text>

  <text x="350" y="290" font-size="12" text-anchor="middle" fill="#555">
    Waterfall : séquentiel et rigide. Agile : itératif, s'adapte au changement en continu.
  </text>
</svg>
