<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 220" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="475" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Cycle de vie Maven (phases principales)</text>

  <g font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="10" y="60" width="130" height="60" rx="8" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="2"/>
    <text x="75" y="95" fill="#1a3a75">validate</text>

    <rect x="160" y="60" width="130" height="60" rx="8" fill="#e6f5ea" stroke="#2e9e4f" stroke-width="2"/>
    <text x="225" y="95" fill="#1e6b34">compile</text>

    <rect x="310" y="60" width="130" height="60" rx="8" fill="#fdf3e3" stroke="#d69a1f" stroke-width="2"/>
    <text x="375" y="95" fill="#8a5a00">test</text>

    <rect x="460" y="60" width="130" height="60" rx="8" fill="#fdeaf1" stroke="#c8447a" stroke-width="2"/>
    <text x="525" y="95" fill="#8a1f4d">package</text>

    <rect x="610" y="60" width="130" height="60" rx="8" fill="#eee6fb" stroke="#7a4fd6" stroke-width="2"/>
    <text x="675" y="95" fill="#43208a">verify</text>

    <rect x="760" y="60" width="180" height="60" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
    <text x="850" y="88" fill="#8a1f1f">install</text>
    <text x="850" y="106" font-size="11" font-weight="normal" fill="#555">(dépôt local ~/.m2)</text>
  </g>

  <g stroke="#555" stroke-width="2" marker-end="url(#arrow2)">
    <line x1="140" y1="90" x2="158" y2="90"/>
    <line x1="290" y1="90" x2="308" y2="90"/>
    <line x1="440" y1="90" x2="458" y2="90"/>
    <line x1="590" y1="90" x2="608" y2="90"/>
    <line x1="740" y1="90" x2="758" y2="90"/>
  </g>

  <text x="475" y="155" font-size="12.5" fill="#333" text-anchor="middle">Lancer une phase exécute automatiquement TOUTES les phases précédentes.</text>
  <text x="475" y="175" font-size="12.5" fill="#333" text-anchor="middle"><tspan font-family="Consolas, monospace" fill="#1a3a75">mvn test</tspan> exécute donc aussi <tspan font-family="Consolas, monospace" fill="#1e6b34">validate</tspan> + <tspan font-family="Consolas, monospace" fill="#1e6b34">compile</tspan> avant de lancer les tests.</text>
  <text x="475" y="197" font-size="12.5" fill="#555" text-anchor="middle">(non montré : <tspan font-family="Consolas, monospace">deploy</tspan>, la dernière phase — publie vers un dépôt distant partagé par l'équipe)</text>
</svg>
