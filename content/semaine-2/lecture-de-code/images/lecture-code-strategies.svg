<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Segoe UI, Arial, sans-serif">
  <text x="300" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Stratégies de lecture de code</text>

  <!-- layers -->
  <rect x="175" y="60" width="250" height="50" rx="8" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="2"/>
  <text x="300" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a3a75">Contrôleur (points d'entrée)</text>

  <rect x="175" y="130" width="250" height="50" rx="8" fill="#e6f5ea" stroke="#2e9e4f" stroke-width="2"/>
  <text x="300" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e6b34">Service (logique métier)</text>

  <rect x="175" y="200" width="250" height="50" rx="8" fill="#fdf3e3" stroke="#d69a1f" stroke-width="2"/>
  <text x="300" y="230" font-size="13" font-weight="bold" text-anchor="middle" fill="#8a5a00">Accès aux données / modèle</text>

  <!-- top-down arrow -->
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6fd6"/>
    </marker>
    <marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e9e4f"/>
    </marker>
  </defs>
  <line x1="140" y1="85" x2="140" y2="225" stroke="#3b6fd6" stroke-width="2" marker-end="url(#a7)"/>
  <text x="115" y="155" font-size="12" fill="#1a3a75" text-anchor="middle" transform="rotate(-90 115 155)">Top-down</text>

  <!-- bottom-up arrow -->
  <line x1="460" y1="225" x2="460" y2="85" stroke="#2e9e4f" stroke-width="2" marker-end="url(#a8)"/>
  <text x="485" y="155" font-size="12" fill="#1e6b34" text-anchor="middle" transform="rotate(90 485 155)">Bottom-up</text>

  <!-- Tests and debugger boxes -->
  <rect x="60" y="290" width="200" height="60" rx="8" fill="#fdeaf1" stroke="#c8447a" stroke-width="2"/>
  <text x="160" y="315" font-size="13" font-weight="bold" text-anchor="middle" fill="#8a1f4d">Tests existants</text>
  <text x="160" y="333" font-size="11" text-anchor="middle" fill="#333">documentation vivante</text>

  <rect x="340" y="290" width="200" height="60" rx="8" fill="#eee6fb" stroke="#7a4fd6" stroke-width="2"/>
  <text x="440" y="315" font-size="13" font-weight="bold" text-anchor="middle" fill="#43208a">Débogueur</text>
  <text x="440" y="333" font-size="11" text-anchor="middle" fill="#333">observer l'exécution réelle</text>

  <text x="300" y="385" font-size="12" text-anchor="middle" fill="#555">
    Quatre stratégies complémentaires, combinées de façon opportuniste selon les indices disponibles.
  </text>
</svg>
