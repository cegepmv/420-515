<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="490" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">
    Où se situe la publication Docker dans le pipeline CI/CD (ci.yml)
  </text>

  <!-- Trigger box -->
  <rect x="10" y="60" width="150" height="60" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
  <text x="85" y="86" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">push / pull_request</text>
  <text x="85" y="104" font-size="12" text-anchor="middle" fill="#555">ciblant main</text>

  <line x1="160" y1="90" x2="198" y2="90" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Job build-and-test -->
  <rect x="200" y="50" width="230" height="80" rx="8" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="2"/>
  <text x="315" y="74" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a3a75">Job : build-and-test</text>
  <text x="315" y="92" font-size="11.5" text-anchor="middle" fill="#1a3a75">matrice JDK 21 / JDK 25</text>
  <text x="315" y="109" font-size="11.5" text-anchor="middle" fill="#1a3a75">./mvnw -B clean verify</text>

  <line x1="430" y1="90" x2="468" y2="90" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="449" y="76" font-size="10.5" text-anchor="middle" fill="#8a1f1f" font-weight="bold">needs:</text>

  <!-- Job build-and-push-image -->
  <rect x="470" y="40" width="260" height="130" rx="8" fill="#fdeaf1" stroke="#c8447a" stroke-width="2"/>
  <text x="600" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#8a1f4d">Job : build-and-push-image</text>
  <text x="600" y="80" font-size="11" text-anchor="middle" fill="#8a1f4d">build: toujours · push: hors PR seulement</text>
  <text x="600" y="150" font-size="10" text-anchor="middle" fill="#8a1f4d">réutilise le .jar de build-and-test (aucune recompilation)</text>

  <rect x="486" y="92" width="110" height="30" rx="6" fill="#ffffff" stroke="#c8447a" stroke-width="1.5"/>
  <text x="541" y="111" font-size="11" text-anchor="middle" fill="#8a1f4d">docker build</text>

  <rect x="604" y="92" width="110" height="30" rx="6" fill="#ffffff" stroke="#c8447a" stroke-width="1.5"/>
  <text x="659" y="111" font-size="11" text-anchor="middle" fill="#8a1f4d">docker push</text>

  <line x1="730" y1="105" x2="768" y2="105" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Registry box -->
  <rect x="770" y="65" width="200" height="80" rx="8" fill="#eee6fb" stroke="#7a4fd6" stroke-width="2"/>
  <text x="870" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#43208a">GHCR</text>
  <text x="870" y="107" font-size="10.5" text-anchor="middle" fill="#43208a">ghcr.io/&lt;repo&gt;:&lt;sha&gt;</text>
  <text x="870" y="122" font-size="10.5" text-anchor="middle" fill="#43208a">ghcr.io/&lt;repo&gt;:latest</text>

  <!-- Dashed boundary around the whole workflow -->
  <rect x="195" y="25" width="545" height="155" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="467" y="200" font-size="11.5" text-anchor="middle" fill="#555">un seul fichier de workflow : .github/workflows/ci.yml</text>

  <!-- Explanatory notes -->
  <text x="490" y="230" font-size="12.5" text-anchor="middle" fill="#333">Le job de publication ne démarre que si <tspan font-family="Consolas, monospace" fill="#8a1f1f">build-and-test</tspan> a réussi (<tspan font-family="Consolas, monospace" fill="#8a1f1f">needs:</tspan>).</text>
  <text x="490" y="250" font-size="12.5" text-anchor="middle" fill="#333">Aucune image n'est jamais publiée à partir d'un code dont les tests échouent.</text>
  <text x="490" y="275" font-size="12.5" text-anchor="middle" fill="#333">Sur une Pull Request, l'image est construite (pour valider le <tspan font-family="Consolas, monospace" fill="#1a3a75">Dockerfile</tspan>)</text>
  <text x="490" y="295" font-size="12.5" text-anchor="middle" fill="#333">mais jamais publiée : <tspan font-family="Consolas, monospace" fill="#8a1f4d">push: event_name != pull_request</tspan>.</text>
</svg>
