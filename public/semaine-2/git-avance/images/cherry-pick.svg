<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Segoe UI, Arial, sans-serif">
  <text x="350" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">git cherry-pick</text>

  <!-- source branch -->
  <line x1="40" y1="90" x2="360" y2="90" stroke="#2e9e4f" stroke-width="2"/>
  <circle cx="70" cy="90" r="8" fill="#2e9e4f"/>
  <circle cx="150" cy="90" r="9" fill="#d69a1f"/>
  <circle cx="230" cy="90" r="8" fill="#2e9e4f"/>
  <circle cx="310" cy="90" r="8" fill="#2e9e4f"/>
  <text x="40" y="112" font-size="11" fill="#1e6b34">brouillon-a</text>
  <text x="150" y="76" font-size="10" text-anchor="middle" fill="#8a5a00">commit utile</text>

  <!-- target branch -->
  <line x1="40" y1="180" x2="360" y2="180" stroke="#3b6fd6" stroke-width="2"/>
  <circle cx="70" cy="180" r="8" fill="#3b6fd6"/>
  <circle cx="150" cy="180" r="8" fill="#3b6fd6"/>
  <circle cx="230" cy="180" r="9" stroke="#d69a1f" stroke-width="2" fill="#fff"/>
  <text x="40" y="202" font-size="11" fill="#1a3a75">main</text>
  <text x="230" y="200" font-size="10" text-anchor="middle" fill="#8a5a00">commit copié</text>

  <path d="M 150 99 C 150 140, 230 140, 230 171" fill="none" stroke="#d69a1f" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a6)"/>
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d69a1f"/>
    </marker>
  </defs>

  <text x="350" y="240" font-size="12" text-anchor="middle" fill="#555">
    Un seul commit choisi est appliqué sur une autre branche, sans fusionner toute la branche source.
  </text>
</svg>
