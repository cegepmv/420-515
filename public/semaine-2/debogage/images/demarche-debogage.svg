<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Step boxes -->
  <g font-size="15" text-anchor="middle">
    <!-- 1. Lire stack trace -->
    <rect x="10" y="115" width="160" height="90" rx="10" fill="#fdf3e3" stroke="#d69a1f" stroke-width="2"/>
    <text x="90" y="145" font-weight="bold" fill="#8a5a00">Lire la</text>
    <text x="90" y="163" font-weight="bold" fill="#8a5a00">stack trace</text>
    <text x="90" y="183" font-size="12" fill="#333">Repérer la cause</text>

    <!-- 2a. Lecture statique -->
    <rect x="220" y="20" width="190" height="85" rx="10" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="2"/>
    <text x="315" y="48" font-weight="bold" fill="#1a3a75">Lecture statique</text>
    <text x="315" y="67" font-size="12" fill="#333">Suivre le flot mentalement,</text>
    <text x="315" y="83" font-size="12" fill="#333">sans exécuter le programme</text>

    <!-- 2b. Reproduction dynamique -->
    <rect x="220" y="215" width="190" height="85" rx="10" fill="#e6f5ea" stroke="#2e9e4f" stroke-width="2"/>
    <text x="315" y="243" font-weight="bold" fill="#1e6b34">Reproduction</text>
    <text x="315" y="261" font-size="12" fill="#333">Déclencher et isoler le</text>
    <text x="315" y="277" font-size="12" fill="#333">bogue en l'exécutant</text>

    <!-- 3. Hypothèse -->
    <rect x="460" y="115" width="150" height="90" rx="10" fill="#fdeaf1" stroke="#c8447a" stroke-width="2"/>
    <text x="535" y="150" font-weight="bold" fill="#8a1f4d">Hypothèse</text>
    <text x="535" y="170" font-size="12" fill="#333">Cause vérifiable</text>

    <!-- 4. Vérifier -->
    <rect x="660" y="115" width="150" height="90" rx="10" fill="#eee6fb" stroke="#7a4fd6" stroke-width="2"/>
    <text x="735" y="150" font-weight="bold" fill="#43208a">Vérifier</text>
    <text x="735" y="170" font-size="12" fill="#333">Confirmer ou</text>
    <text x="735" y="185" font-size="12" fill="#333">réfuter, ajuster</text>
  </g>

  <!-- Arrows: stack trace -> both strategies -->
  <g stroke="#555" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <path d="M 170 140 C 195 110, 195 80, 218 62"/>
    <path d="M 170 180 C 195 220, 195 250, 218 257"/>
    <!-- both strategies -> hypothèse -->
    <path d="M 410 62 C 435 90, 435 110, 458 140"/>
    <path d="M 410 257 C 435 230, 435 210, 458 180"/>
    <!-- hypothèse -> vérifier -->
    <line x1="610" y1="160" x2="658" y2="160"/>
  </g>

  <!-- Feedback loop: réfuter -> reformuler hypothèse -->
  <path d="M 735 205 C 735 250, 535 250, 535 207" fill="none" stroke="#c8447a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="635" y="270" font-size="12" fill="#8a1f4d" text-anchor="middle">hypothèse réfutée → on reformule</text>

  <!-- Title -->
  <text x="450" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Démarche méthodique de débogage</text>
</svg>
